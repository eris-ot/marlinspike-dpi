[workspace]
members = [".", "marlinspike-dpi-py"]
resolver = "2"

[package]
name = "marlinspike-dpi"
version = "1.16.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Pure-Rust passive deep packet inspection for OT/ICS and IT — Modbus, DNP3, S7comm, OPC UA, IEC 61850, SMB2, Kerberos, LDAP. PCAP/PCAPNG → Bronze v2 / OCSF / InfluxDB."
readme = "README.md"
publish = false
keywords = ["dpi", "modbus", "scada", "ot", "pcap"]
categories = ["network-programming", "parser-implementations", "command-line-utilities"]

[features]
default = []
ffi = []

[lib]
name = "fm_dpi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[build-dependencies]
prost-build = "0.14"

[[bench]]
name = "throughput"
harness = false

[dependencies]
fathom-contracts = { path = "vendor/fathom-contracts" }
tracing = "0.1"
bytes = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prost = "0.14"
inventory = "0.3"
