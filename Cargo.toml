[workspace]
members = [".", "marlinspike-dpi-py"]
resolver = "2"

[package]
name = "marlinspike-dpi"
version = "1.17.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Pure-Rust passive deep packet inspection for OT/ICS and IT — Modbus, DNP3, S7comm, OPC UA, IEC 61850, SMB2, Kerberos, LDAP. PCAP/PCAPNG → Bronze v2 / OCSF / InfluxDB."
readme = "README.md"
publish = false
keywords = ["dpi", "modbus", "scada", "ot", "pcap"]
categories = ["network-programming", "parser-implementations", "command-line-utilities"]

[features]
# A bare build is byte-for-byte equivalent to before feature-gating existed:
# every protocol is compiled in. Subsetting is strictly opt-in via
# `--no-default-features --features "modbus,dnp3,..."` (or a bundle).
default = ["all"]
ffi = []

# ── Bundles ─────────────────────────────────────────────────────
# Bundles are convenience aggregates over the per-protocol leaf features.
all = ["ot", "it", "l2"]

# Link-layer / L2 control protocols.
l2 = [
    "arp", "lldp", "cdp", "stp", "vtp", "mrp", "mstp", "pvst", "prp", "lacp",
    "avtp",
]

# OT / ICS / industrial protocols.
ot = [
    "modbus", "modbus_udp", "dnp3", "dnp3_sav5", "s7comm", "opc_ua",
    "opc_ua_pubsub", "opc_classic", "ethernet_ip", "eip_io", "cip_safety",
    "hart_ip", "iec104", "iec61850", "bacnet", "bacnet_sc", "fins", "profinet",
    "ethercat", "powerlink", "sercos", "ptp", "ff_hse", "ge_srtp", "melsec",
    "roc_plus", "tristation", "umas", "vnet_ip", "ab_csp", "ads", "osi_pi",
    "gvcp", "synchrophasor", "cclink", "codesys", "iolink",
]

# Enterprise / IT protocols.
it = [
    "dns", "dhcp", "snmp", "http", "tls", "mqtt", "mqtt_sn", "ntp", "syslog",
    "ftp", "ssh", "radius", "icmp", "amqp", "coap", "dcerpc", "diameter",
    "kerberos", "ldap", "netbios", "netflow", "ntlmssp", "openvpn", "quic",
    "radsec", "rdp", "sip_rtp", "smb2", "smb", "smtp", "tacacs", "tftp", "vnc",
    "winrm", "wireguard", "discovery", "ike", "igmp",
]

# ── Per-protocol leaf features ──────────────────────────────────
# Each gates both the packet-level dissector and the session-level
# decoder for that protocol, wherever both exist. Leaves are
# independent unless a comment notes an implied dependency.

# L2
arp = []
lldp = []
cdp = []
stp = []
vtp = []
mrp = []
mstp = []
pvst = []
prp = []
lacp = []
avtp = []

# OT
modbus = []
modbus_udp = []
dnp3 = []
dnp3_sav5 = []
s7comm = []
opc_ua = []
opc_ua_pubsub = []
opc_classic = []
ethernet_ip = []
eip_io = []
cip_safety = []
hart_ip = []
iec104 = []
iec61850 = []
bacnet = []
bacnet_sc = []
fins = []
profinet = []
ethercat = []
powerlink = []
sercos = []
ptp = []
ff_hse = []
ge_srtp = []
melsec = []
roc_plus = []
tristation = []
umas = []
vnet_ip = []
ab_csp = []
ads = []
osi_pi = []
gvcp = []
synchrophasor = []
cclink = []
codesys = []
iolink = []

# IT
dns = []
dhcp = []
snmp = []
http = []
tls = []
mqtt = []
mqtt_sn = []
ntp = []
syslog = []
ftp = []
ssh = []
radius = []
icmp = []
amqp = []
coap = []
dcerpc = []
diameter = []
kerberos = []
ldap = []
netbios = []
netflow = []
ntlmssp = []
openvpn = []
quic = []
radsec = []
rdp = []
sip_rtp = []
smb2 = []
smb = []
smtp = []
tacacs = []
tftp = []
vnc = []
winrm = []
wireguard = []
discovery = []
ike = []
igmp = []

[lib]
name = "fm_dpi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[build-dependencies]
prost-build = "0.14"

[[bench]]
name = "throughput"
harness = false

[dependencies]
fathom-contracts = { path = "vendor/fathom-contracts" }
tracing = "0.1"
bytes = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prost = "0.14"
inventory = "0.3"
